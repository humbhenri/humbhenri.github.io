<picture>
  <source
    srcset="{{ include.path | append: '.avif' | relative_url }}"
    type="image/avif">

  <source
    srcset="{{ include.path | append: '.webp' | relative_url }}"
    type="image/webp">

  <img
    src="{{ include.path | relative_url }}"
    alt="{{ include.alt }}"
    loading="lazy">
</picture>
